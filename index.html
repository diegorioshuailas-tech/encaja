<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cauce · Baños y revestimientos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
/* Cauce — casa de revestimientos: la foto es la interfaz, esquinas rectas, un solo acento terracota, contraste de peso con una sola familia */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunken:#F3F3F3; --ink:#0A0A0A; --muted:#818180; --line:#E2E2E0; --mid:#AFAFAF;
  --btn:#0A0A0A; --on-btn:#FFFFFF; --accent:#E4572E; --ok:#2F6B4F; --ok-bg:#E8F0EB; --warn:#B4441F; --warn-bg:#F8E7DF;
  --f:"Poppins", "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif;
  --wrap:1300px; --nav-h:72px;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --surface:#151515; --sunken:#1D1D1C; --ink:#F2F2F0; --muted:#9A9A98; --line:#2C2C2B; --mid:#6A6A68;
  --btn:#F2F2F0; --on-btn:#0A0A0A; --ok:#86C7A3; --ok-bg:#16271E; --warn:#F09A78; --warn-bg:#33201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#151515; --sunken:#1D1D1C; --ink:#F2F2F0; --muted:#9A9A98; --line:#2C2C2B; --mid:#6A6A68;
  --btn:#F2F2F0; --on-btn:#0A0A0A; --ok:#86C7A3; --ok-bg:#16271E; --warn:#F09A78; --warn-bg:#33201A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-weight:400;letter-spacing:-.015em;line-height:1.08;text-wrap:balance;margin:0}
h1 b,h2 b,h3 b{font-weight:700}
.dot{color:var(--accent);font-style:normal}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons: square, tracked uppercase, 2px border */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 30px;border-radius:0;border:2px solid var(--btn);font-weight:600;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:background-color 200ms ease,color 200ms ease,border-color 200ms ease,transform 160ms var(--ease-out);white-space:nowrap;background:transparent}
.btn .ico{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--btn);color:var(--on-btn)}
.btn-dark:hover{background:transparent;color:var(--ink)}
.btn-line{background:var(--surface);color:var(--ink)}
.btn-line:hover{background:var(--btn);color:var(--on-btn)}
.btn-ghost{border-color:transparent;padding:0 12px}
.btn-ghost:hover{border-color:var(--line)}
.btn-light{background:#fff;color:#0A0A0A;border-color:#fff}
.btn-light:hover{background:transparent;color:#fff}
.btn-outline-light{border-color:#fff;color:#fff}
.btn-outline-light:hover{background:#fff;color:#0A0A0A}
.btn-sm{min-height:40px;padding:0 16px;font-size:10.5px;letter-spacing:1.5px;gap:8px}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;position:relative;transition:background-color 200ms ease,transform 160ms var(--ease-out)}
.iconbtn:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.iconbtn:active,.chip:active,.pi:active,.floattb button:active,.swpick button:active,.qty button:active,.seg button:active,.grouts button:active{transform:scale(.95)}
.iconbtn.sq{border-radius:0;background:var(--btn);color:var(--on-btn);width:44px;height:44px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;white-space:nowrap;text-decoration:none;transition:background-color 200ms ease,color 200ms ease,border-color 200ms ease}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"],.chip.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}

/* promo + header */
.promo{background:#0A0A0A;color:#fff;font-size:11px;letter-spacing:1px;text-transform:uppercase;position:relative;z-index:51}
.promo .wrap{display:flex;gap:32px;justify-content:center;padding-block:9px;overflow:hidden;white-space:nowrap}
.promo b{font-weight:600;color:#fff}
.promo span+span::before{content:"";display:inline-block;width:1px;height:10px;background:rgba(255,255,255,.35);margin-right:32px;vertical-align:-1px}
header.top{position:sticky;top:0;z-index:50;background:var(--sunken);border-bottom:1px solid var(--line);box-shadow:0 2px 5px rgba(50,50,50,.08);transition:background-color 250ms ease,color 250ms ease,border-color 250ms ease}
.nav{display:flex;align-items:center;gap:22px;min-height:var(--nav-h)}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:5px;text-decoration:none;line-height:1}
.logo svg{width:20px;height:20px;flex:none}
.navlinks{display:flex;align-items:center;margin-left:18px}
.navlinks a{padding:4px 16px;font-size:14.5px;text-decoration:none;white-space:nowrap;line-height:1.2;position:relative}
.navlinks a+a{border-left:1px solid currentColor;border-left-color:color-mix(in srgb,currentColor 30%,transparent)}
.navlinks a::after{content:"";position:absolute;left:16px;right:16px;bottom:-6px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform 220ms var(--ease-out)}
.navlinks a:hover::after,.navlinks a.on::after{transform:scaleX(1)}
.nav .sp{flex:1}
.navcta{border-color:currentColor;color:inherit}
.navcta:hover{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
body.home:not(.scrolled) .navcta:hover{background:#fff;color:#0A0A0A;border-color:#fff}
.searchbox{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-bottom:1px solid currentColor;border-bottom-color:color-mix(in srgb,currentColor 35%,transparent);min-width:0;width:200px}
.searchbox input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:13.5px}
.searchbox input::placeholder{color:inherit;opacity:.6}
.badge-n{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.catrow{display:none}
/* home: the nav floats over the photograph */
body.home header.top{position:fixed;left:0;right:0;top:var(--promo-h,35px);background:rgba(10,10,10,.42);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:none;color:#fff;border-color:rgba(255,255,255,.22)}
body.home.scrolled header.top{background:var(--sunken);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 2px 5px rgba(50,50,50,.08);color:var(--ink);border-color:var(--line)}
@media (max-width:1180px){.navlinks{display:none}.catrow{display:flex;gap:8px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}.catrow::-webkit-scrollbar{display:none}body.home:not(.scrolled) .catrow .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}}
@media (max-width:1380px){.nav .searchbox{width:150px}}
@media (max-width:720px){.searchbox{display:none}.nav .cta-desk{display:none}.logo{font-size:19px;letter-spacing:4px}.promo .p2,.promo .p3{display:none}}

main{min-height:60vh}
section{padding-block:44px}

/* hero: full-bleed before / after */
.hero{padding:0}
.hero{position:relative;height:100svh;min-height:600px;max-height:960px;background:#1a1a1a;color:#fff;overflow:hidden}
.ba{position:absolute;inset:0;user-select:none;touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block}
.ba .after{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}
.ba .line{position:absolute;top:0;bottom:0;left:0;will-change:transform;width:1px;background:#fff;z-index:2}
.ba .knob{position:absolute;top:58%;left:0;will-change:transform;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;color:#0A0A0A;display:grid;place-items:center;border:0;cursor:ew-resize;z-index:3;box-shadow:0 2px 5px rgba(50,50,50,.1)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.27) 42%,rgba(0,0,0,0) 70%),linear-gradient(0deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%);pointer-events:none;z-index:1}
.herocopy{position:absolute;left:0;right:0;bottom:clamp(40px,9vh,96px);z-index:4;pointer-events:none}
.herocopy .wrap>*{pointer-events:auto}
.herocopy .wrap{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.herocopy h1{font-size:clamp(40px,5.4vw,72px);line-height:1.04}
.herocopy p{margin:0;max-width:46ch;font-size:16px;font-weight:300;color:rgba(255,255,255,.88)}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .tag{position:absolute;top:calc(var(--nav-h) + var(--promo-h,35px) + 24px);z-index:3;color:#fff;font-size:11px;letter-spacing:2px;font-weight:600;text-transform:uppercase;pointer-events:none}
.hero .tag i{display:inline-block;width:18px;height:1px;background:currentColor;vertical-align:middle;margin:0 10px}
.hero .facts{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:clamp(40px,9vh,96px);z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;text-align:right;pointer-events:none}
.hero .facts b{font-size:13px;font-weight:600}
.hero .facts span{color:rgba(255,255,255,.75)}
@media (max-width:760px){.hero{height:auto;min-height:0;max-height:none;display:flex;flex-direction:column;padding-top:calc(var(--nav-h) + 60px)}.ba{position:relative;inset:auto;aspect-ratio:4/3}.hero .shade{display:none}.herocopy{position:relative;bottom:auto;padding-block:28px 36px}.hero .facts{display:none}.hero .tag{top:auto;bottom:12px;z-index:3}.hero .tag em{display:none}}
.hero .tag em{font-style:normal}
.shimmer{background:linear-gradient(100deg,var(--sunken) 30%,color-mix(in srgb,var(--sunken) 55%,var(--surface)) 50%,var(--sunken) 70%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* section heads: regular line + bold line */
.shead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.shead h2{font-size:clamp(28px,3.2vw,40px)}
.shead p{margin:8px 0 0;color:var(--muted);font-weight:300;font-size:16px;max-width:52ch}
.link{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-decoration:none;display:inline-flex;gap:8px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:4px}
.link .ico{width:14px;height:14px}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.cat{text-decoration:none;display:flex;flex-direction:column;gap:12px;min-width:0}
.cat .img{aspect-ratio:3/4;display:block;position:relative;overflow:hidden;background:var(--sunken)}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 600ms var(--ease-out)}
.cat .img.obj img{inset:10%;width:80%;height:80%;object-fit:contain}
@media (hover:hover) and (pointer:fine){.cat:hover img{transform:scale(1.03)}}
.cat b{font-weight:600;font-size:16px;line-height:1.2;display:flex;justify-content:space-between;align-items:center}
.cat span{font-size:12.5px;color:var(--muted);margin-top:-8px}
@media (max-width:900px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cat:last-child:nth-child(odd){grid-column:1/-1}.cat:last-child:nth-child(odd) .img{aspect-ratio:16/9}}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 20px}
@media (max-width:1020px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}}
.card{display:flex;flex-direction:column;gap:12px;min-width:0;text-decoration:none;position:relative}
.card .imgwrap{position:relative}
.card .img{position:relative;aspect-ratio:4/3;background:var(--sunken);overflow:hidden;display:grid;place-items:center}
.card .img img{width:82%;height:82%;object-fit:contain;transition:transform 400ms var(--ease-out)}
.card.surf .img img{width:100%;height:100%;object-fit:cover}
@media (hover:hover) and (pointer:fine){.card:hover .img img{transform:scale(1.04)}}
.pill{position:absolute;top:0;left:0;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:6px 10px;background:var(--surface);color:var(--ink)}
.pill.sale{background:var(--accent);color:#fff}
.tryon{position:absolute;right:0;bottom:0;display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:0 14px;background:var(--btn);color:var(--on-btn);opacity:0;transform:translateY(4px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);border:0;min-height:38px}
.tryon .ico{width:15px;height:15px}
.card:hover .tryon,.card:focus-within .tryon{opacity:1;transform:none}
@media (hover:none){.tryon{opacity:1;transform:none}}
.card .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.card .name{font-weight:600;font-size:15px;line-height:1.3}
.card .cap{font-size:13px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px}
.price b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.price small{font-size:12px;color:var(--muted)}
.price s{color:var(--mid);font-size:12.5px}
.sw{display:flex;gap:6px;margin-top:4px}
.sw i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}

/* bands */
.fullband{position:relative;min-height:min(78vh,720px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#1a1a1a}
.fullband>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fullband::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.27) 45%,rgba(0,0,0,.05) 75%);z-index:1}
.fullband .wrap{position:relative;z-index:2;width:100%;padding-block:56px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end}
.fullband h2{font-size:clamp(36px,4.6vw,64px)}
.fullband p{margin:14px 0 22px;color:rgba(255,255,255,.85);font-weight:300;max-width:44ch;font-size:16px}
.finishes{display:grid;grid-template-columns:repeat(4,auto);gap:0;border:1px solid rgba(255,255,255,.35)}
.finishes span{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 18px;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.finishes span+span{border-left:1px solid rgba(255,255,255,.35)}
.finishes i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:inset -6px -8px 12px rgba(0,0,0,.28),inset 4px 5px 10px rgba(255,255,255,.35)}
@media (max-width:800px){.fullband::before{background:linear-gradient(0deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,.55) 60%,rgba(0,0,0,.3) 100%)}.fullband .wrap{grid-template-columns:1fr}.finishes{grid-template-columns:repeat(2,1fr)}.finishes span:nth-child(3){border-left:0}.finishes span:nth-child(n+3){border-top:1px solid rgba(255,255,255,.35)}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--sunken)}
.split .vis{position:relative;min-height:560px}
.split .vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.split .copy{padding:clamp(28px,6vw,88px);display:flex;flex-direction:column;gap:18px;justify-content:center}
.split h2{font-size:clamp(32px,3.8vw,52px)}
.split p{margin:0;color:var(--muted);font-weight:300;max-width:44ch;font-size:16px}
.split.rev .vis{order:2}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}.split .vis{min-height:380px}.split.rev .vis{order:0}}
.tilerow{display:flex;gap:0;margin-top:8px}
.tilerow span{width:56px;height:56px;background-size:cover;background-position:center;border:1px solid var(--line)}
.tilerow span+span{border-left:0}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.step{padding:32px 28px;display:flex;flex-direction:column;gap:10px}
.step+.step{border-left:1px solid var(--line)}
.step .n{font-size:40px;font-weight:200;line-height:1;color:var(--mid);font-variant-numeric:tabular-nums}
.step h3{font-size:20px;font-weight:600}
.step p{margin:0;color:var(--muted);font-size:14px;font-weight:300}
@media (max-width:760px){.steps{grid-template-columns:1fr}.step+.step{border-left:0;border-top:1px solid var(--line)}}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-block:1px solid var(--line)}
.trust div{display:flex;gap:14px;align-items:flex-start;font-size:13px;color:var(--muted);padding:26px 22px}
.trust div+div{border-left:1px solid var(--line)}
.trust b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.trust .ico{width:24px;height:24px;margin-top:2px;color:var(--ink)}
@media (max-width:560px){.trust{grid-template-columns:1fr!important}.trust div{border-left:0!important}.trust div+div{border-top:1px solid var(--line)}}
@media (max-width:820px){.trust{grid-template-columns:repeat(2,minmax(0,1fr))}.trust div:nth-child(3){border-left:0}.trust div:nth-child(n+3){border-top:1px solid var(--line)}}
footer{padding-block:56px 64px;color:var(--muted);font-size:13px;background:var(--sunken);margin-top:44px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px}
footer h4{margin:0 0 12px;color:var(--ink);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
footer a{display:block;text-decoration:none;padding:3px 0}
footer a:hover{color:var(--ink)}
@media (max-width:760px){footer .cols{grid-template-columns:1fr 1fr}footer .cols>div:first-child{grid-column:1/-1}}

/* catalog page */
.pageband{position:relative;height:clamp(220px,26vw,340px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#1a1a1a}
.pageband img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pageband::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.36);z-index:1}
.pageband .wrap{position:relative;z-index:2;width:100%;padding-block:32px}
.pageband h1{font-size:clamp(36px,4.4vw,58px);font-weight:700}
.pageband p{margin:6px 0 0;font-weight:300;color:rgba(255,255,255,.88)}
.crumbs{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;padding-top:22px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding-block:16px 24px}
.pagehead h1{font-size:clamp(34px,4vw,52px)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:28px 0 28px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.filters select{height:36px;border:1px solid var(--line);border-radius:0;background:var(--surface);padding:0 12px;font-size:12px;font-weight:500}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:48px;padding-block:16px 20px}
@media (max-width:900px){.pdp{grid-template-columns:1fr;gap:26px}}
.viewer{position:relative;aspect-ratio:1/0.86;background:var(--sunken);overflow:hidden;touch-action:none;cursor:grab;max-width:100%}
.viewer:active{cursor:grabbing}
.viewer canvas{width:100%!important;height:100%!important;display:block}
.viewer>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewer .hint{position:absolute;left:14px;bottom:14px;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;display:flex;gap:6px;align-items:center;background:var(--surface);padding:7px 12px}
.viewer .dimtag{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.viewer .dimtag span{font-size:12px;background:var(--surface);padding:4px 9px;font-variant-numeric:tabular-nums}
.vtabs{display:flex;gap:0;position:absolute;left:14px;top:14px;z-index:2;background:var(--surface)}
.vtabs button{border:0;background:transparent;padding:0 14px;min-height:36px;font-size:10.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.vtabs button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.buy{display:flex;flex-direction:column;gap:18px;min-width:0}
.buy h1{font-size:clamp(30px,3.4vw,44px);font-weight:600;letter-spacing:-.02em}
.rating{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.rating .stars{color:var(--ink);letter-spacing:1px}
.bigprice{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bigprice b{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bigprice small{font-size:14px;color:var(--muted)}
.bigprice s{color:var(--mid)}
.bigprice .off{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:1px}
.payrows{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.payrows .ok{color:var(--ink);font-weight:500}
.opt h4{margin:0 0 10px;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.opt h4 span{color:var(--muted);font-weight:500;letter-spacing:.5px;text-transform:none;font-size:13px}
.swpick{display:flex;gap:10px;flex-wrap:wrap}
.swpick button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);padding:3px;background:var(--surface);transition:transform 160ms var(--ease-out)}
.swpick button i{display:block;width:100%;height:100%;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.swpick button[aria-pressed="true"]{border:2px solid var(--ink)}
.fitbox{border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.fitbox .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fitbox h4{margin:0;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600;display:flex;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500}
.field input,.field select,.ctrl input[type=number]{height:44px;border-radius:0;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:14px;font-weight:400;min-width:0}
.field input:focus,.ctrl input[type=number]:focus{border-color:var(--ink);outline:0}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.calc div{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.calc div+div{border-left:1px solid var(--line)}
.calc span{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:500}
.calc b{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.result{font-size:13.5px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.result.ok{background:var(--ok-bg);color:var(--ok)}
.result.bad{background:var(--warn-bg);color:var(--warn)}
.qtyrow{display:flex;gap:12px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface)}
.qty button{width:44px;height:50px;border:0;background:transparent}
.qty span{min-width:26px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.specs{border-top:1px solid var(--line);margin:0}
.specs div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.specs dt{color:var(--muted)}
.specs dd{margin:0;text-align:right;font-weight:500}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:80;opacity:0;pointer-events:none;transition:opacity 200ms ease}
.scrim.open{opacity:1;pointer-events:auto;transition-duration:300ms}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);color:var(--ink);z-index:90;transform:translateX(102%);transition:transform 220ms var(--ease-out);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none;transition-duration:380ms;transition-timing-function:var(--ease-drawer)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.drawer .items{flex:1;overflow:auto;padding:8px 20px;display:flex;flex-direction:column}
.citem{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.citem img{width:76px;height:76px;object-fit:cover;background:var(--sunken)}
.citem .n{font-weight:500;font-size:14px;line-height:1.3}
.citem .v{font-size:12px;color:var(--muted)}
.drawer footer{padding:18px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;color:var(--ink);background:var(--surface);margin:0}
.sumrow{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sumrow.total{font-size:17px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 24px));background:var(--btn);color:var(--on-btn);padding:14px 20px;font-size:13px;font-weight:500;z-index:120;opacity:0;transition:opacity 180ms ease,transform 180ms ease;pointer-events:none;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);transition-duration:360ms}
.modal{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);padding:22px;max-width:820px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;transition:opacity 250ms var(--ease-out),transform 250ms var(--ease-out)}
.modal .bg{position:absolute;inset:0;background:rgba(0,0,0,.55);transition:opacity 250ms var(--ease-out)}
@starting-style{.modal .bg{opacity:0}.modal .box{opacity:0;transform:scale(.97)}}
.modal.closing .bg{opacity:0;transition-duration:150ms}.modal.closing .box{opacity:0;transform:scale(.98);transition-duration:150ms}
.modal img{width:100%}

/* checkout */
.checkout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;padding-block:10px 30px}
@media (max-width:860px){.checkout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.formgrid{grid-template-columns:1fr}}
.paym{display:flex;flex-direction:column;gap:0}
.paym label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:14px;font-size:14px;cursor:pointer}
.paym label+label{border-top:0}
.paym label:has(input:checked){border-color:var(--ink);background:var(--sunken);position:relative}
.paym input{accent-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted)}

/* ===== Probador IA ===== */
.simpage{background:var(--sunken)}
.sim{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;gap:16px;padding-block:18px 36px;align-items:start}
@media (max-width:1180px){.sim{grid-template-columns:240px minmax(0,1fr) 290px}}
@media (max-width:980px){.sim{grid-template-columns:minmax(0,1fr)}.sim .left{order:2}.sim .right{order:3}}
.simhead{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;padding-top:26px}
.simhead h1{font-size:clamp(30px,3.6vw,48px)}
.simhead p{margin:10px 0 0;color:var(--muted);max-width:62ch;font-weight:300}
.side{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side h3{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.side h3 .ico{width:16px;height:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex-wrap:wrap}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{min-height:30px;padding:0 10px;font-size:11.5px}
.plist{display:flex;flex-direction:column;gap:2px;max-height:620px;overflow:auto;margin-right:-8px;padding-right:8px}
@media (max-width:980px){.tabs{flex-wrap:nowrap}.plist{flex-direction:row;max-height:none;overflow-x:auto;padding-bottom:6px}.plist .pi{flex:0 0 240px}}
.pi{display:grid;grid-template-columns:58px minmax(0,1fr) 34px;gap:12px;align-items:center;padding:6px;border:1px solid transparent;background:transparent;text-align:left;width:100%;transition:background-color 200ms ease,transform 160ms var(--ease-out)}
.pi:hover{background:var(--sunken)}
.pi>.shimmer,.pi>span:first-child{width:58px;height:58px;display:block;background:var(--sunken);overflow:hidden}
.pi img{width:58px;height:58px;object-fit:cover;display:block}
.pi .n{display:block;font-size:12.5px;font-weight:500;line-height:1.3}
.pi .p{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.pi .add{width:34px;height:34px;background:var(--btn);color:var(--on-btn);display:grid;place-items:center}
.pi .add .ico{width:16px;height:16px}
.stagecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .btn-sm{padding:0 12px}
.toolbar .seg button{padding:0 11px}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border:0;background:transparent;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:background-color 200ms ease,color 200ms ease}
.seg button+button{border-left:1px solid var(--line)}
.seg button .ico{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.stage{position:relative;overflow:hidden;background:#1a1a1a;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;margin-inline:auto}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .gl{cursor:default}
.stage.paint .gl{cursor:crosshair}
.edgebtn .ico{color:var(--accent)}
.edgebtn.btn-dark .ico{color:inherit}
.stage .drop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff;font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:opacity 150ms ease;z-index:5}
.stage.dragover .drop{opacity:1}
.stage .status{position:absolute;left:0;bottom:0;z-index:4;pointer-events:none;display:flex;gap:10px;align-items:center;background:rgba(10,10,10,.72);color:#fff;font-size:12px;font-weight:500;padding:9px 14px;max-width:100%}
.stage .status span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.stage .status{font-size:11px;padding:7px 10px}}
.stage .status .dot{width:8px;height:8px;border-radius:50%;background:#86C7A3;flex:none}
.stage .status.busy .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.horizon{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--accent);z-index:3;pointer-events:none}
.horizon button{pointer-events:auto;position:absolute;right:12px;top:-15px;height:30px;padding:0 12px;border:0;background:var(--accent);color:#fff;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:600;cursor:ns-resize;touch-action:none}
.floattb{position:absolute;z-index:6;display:flex;gap:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);transform:translate(-50%,-100%);white-space:nowrap;transform-origin:50% 100%;transition:opacity 150ms var(--ease-out),scale 150ms var(--ease-out);box-shadow:0 2px 5px rgba(50,50,50,.1)}
@starting-style{.floattb{opacity:0;scale:.94}}
.floattb button{width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;transition:background-color 200ms ease,transform 160ms var(--ease-out)}
.floattb button+button{border-left:1px solid var(--line)}
.floattb button:hover{background:var(--sunken)}
.floattb .ico{width:17px;height:17px}
.ctrl{display:flex;flex-direction:column;gap:8px;font-size:12px}
.ctrl>label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.ctrl>label span{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px;font-variant-numeric:tabular-nums}
.ctrl .seg{align-self:flex-start}
.ctrl input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.stagefoot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.surfhead{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.surfhead .sq{width:56px;height:56px;display:block;overflow:hidden;background:var(--sunken)}
.surfhead img{width:56px;height:56px;object-fit:cover;display:block}
.surfhead b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.surfhead .muted{font-size:12px}
.surfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
@media (max-width:640px){.surfgrid{grid-template-columns:1fr}}
.zonepanel{gap:14px}
.zstep{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.zstep .n{width:22px;height:22px;display:grid;place-items:center;background:var(--btn);color:var(--on-btn);font-size:11px;flex:none}
.pickname{margin:0;font-size:13.5px}
.pickname span{color:var(--muted)}
.note.big{font-size:14px}
.check{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.howto{list-style:none;margin:12px 0 0;padding:0;display:flex;gap:8px 22px;flex-wrap:wrap;counter-reset:h;font-size:14px;color:var(--muted)}
.howto li{counter-increment:h;display:flex;gap:8px;align-items:center}
.howto li::before{content:counter(h);width:22px;height:22px;display:grid;place-items:center;background:var(--btn);color:var(--on-btn);font-size:11px;font-weight:600}
.howto b{color:var(--ink);font-weight:600}
.stage .status{opacity:0;transform:translateY(4px);transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
.stage .status.show{opacity:1;transform:none}
.zhead .seg button{min-height:42px;padding:0 18px;font-size:11.5px}
.zonebar{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.zchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 6px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;transition:border-color 200ms ease,background-color 200ms ease,transform 160ms var(--ease-out)}
.zchip:hover{border-color:var(--ink)}
.zchip:active{transform:scale(.97)}
.zchip i{width:28px;height:28px;display:block;flex:none;border:1px solid rgba(0,0,0,.12)}
.zchip[aria-selected="true"]{border:2px solid var(--ink);padding-left:5px}
.zchip.add{padding-left:12px;color:var(--muted);border-style:dashed}
.zchip.add[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-style:solid;border-color:var(--btn)}
.zchip.add .ico{width:15px;height:15px}
.zbody{display:flex;flex-direction:column;gap:16px}
.zhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.zhead b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.zhead .eyebrow{font-size:10px}
.swstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.swstrip button{aspect-ratio:1;border:1px solid var(--line);padding:0;transition:transform 160ms var(--ease-out),outline-color 150ms ease;outline:2px solid transparent;outline-offset:2px}
.swstrip button[aria-pressed="true"]{outline-color:var(--ink)}
@media (hover:hover) and (pointer:fine){.swstrip button:hover{transform:scale(1.06)}}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette button{width:32px;height:32px;border:1px solid rgba(0,0,0,.14);padding:0;outline:2px solid transparent;outline-offset:2px;transition:transform 160ms var(--ease-out)}
.palette.big button{width:40px;height:40px}
.palette button[aria-pressed="true"]{outline-color:var(--ink)}
.palette button.none{background:repeating-linear-gradient(45deg,var(--sunken) 0 4px,var(--line) 4px 5px)}
.palette button:active{transform:scale(.94)}
.colorpick{position:relative;display:inline-grid;place-items:center;width:32px;height:32px;border:1px dashed var(--mid);cursor:pointer;color:var(--muted)}
.palette.big .colorpick{width:40px;height:40px}
.grouts .colorpick{width:40px;height:38px;border-left:0}
.colorpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.colorpick .ico{width:14px;height:14px}
.zmore summary{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted);list-style:none;display:flex;gap:6px;align-items:center}
.zmore summary::-webkit-details-marker{display:none}
.zmore summary::before{content:"+";font-size:14px;width:12px}
.zmore[open] summary::before{content:"–"}
.zmore[open]{display:flex;flex-direction:column;gap:12px}
.dotc{display:inline-block;width:10px;height:10px;border:1px solid rgba(0,0,0,.15);margin-right:6px;vertical-align:-1px}
.grouts{display:flex;gap:0}
.grouts button{width:40px;height:38px;border:1px solid var(--line);transition:transform 160ms var(--ease-out)}
.grouts button+button{border-left:0}
.grouts button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px;position:relative;z-index:1}
.aibox{background:var(--sunken);padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.aibox.selbox{background:var(--surface);border:1px solid var(--line)}
.aihead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.aihead b{font-weight:600}
.aihead .eyebrow{font-size:9.5px;letter-spacing:1.5px}
.aibox .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:12.5px;margin:0}
.aibox .kv dt{color:var(--muted)}
.aibox .kv dd{margin:0;font-weight:500}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg>.eyebrow{font-size:10px}
.sg{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);padding:6px}
.sg>span:first-child{width:46px;height:46px;display:block;overflow:hidden;background:var(--sunken)}
.sg img{width:46px;height:46px;object-fit:cover;display:block}
.sg .n{font-size:12.5px;font-weight:600;line-height:1.25}
.sg .r{font-size:12px;color:var(--muted);line-height:1.4}
.askrow{display:flex;gap:0}
.askrow input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-right:0;background:var(--surface);padding:0 14px;font-size:13.5px;border-radius:0}
.answer{font-size:13.5px;white-space:pre-wrap;line-height:1.55}
.proj{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.prow .n{font-weight:500;cursor:pointer}
.prow .chk{grid-column:1/-1;font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .chk b{font-weight:600}

  /* ---------- superficies: atlas de baldosas con juntas ---------- */
  const IMGP = {};
  function loadImg(url) { if (!IMGP[url]) IMGP[url] = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); return IMGP[url]; }
  const ATLAS = {};
  /** Builds a canvas of ~2.4 m of laid tiles: each tile a different crop of the source photo, grout in between. */
  async function tileAtlas(p, grout = '#d9d6d0', jointMm = 2) {
    const key = p.id + grout + jointMm; if (ATLAS[key]) return ATLAS[key];
    const PX = 4, [tw, th] = p.fmt, span = 240; // 4 px per cm, 2.4 m square that repeats seamlessly
    const W = span * PX, H = span * PX;
    const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    g.fillStyle = grout; g.fillRect(0, 0, W, H);
    const jp = Math.max(1, jointMm / 10 * PX);
    let src = null; if (!p.tex.startsWith('proc:')) src = await loadImg(p.tex);
    seed = p.id.length * 97 + p.id.charCodeAt(0);
    // long side horizontal; every row is a list of tiles whose random look is indexed modulo the row, so the atlas wraps without seams
    const L = Math.max(tw, th) * PX, S = Math.min(tw, th) * PX, rows = Math.round(H / S), n = Math.round(W / L);
    const stagger = p.plank ? 1 / 3 : (p.tex.startsWith('proc:') ? 0.5 : 0);
    for (let r = 0; r < rows; r++) {
      const rv = Array.from({ length: n }, () => [rnd(), rnd(), rnd(), rnd(), rnd(), rnd(), rnd(), rnd(), rnd(), rnd()]);
      const off = ((r * stagger) % 1) * L, y = r * S;
      for (let k = -1; k <= n; k++) {
        const x = k * L + off, R = rv[((k % n) + n) % n]; let ri = 0; const q = () => R[ri++ % R.length];
        g.save(); g.beginPath(); g.rect(x + jp / 2, y + jp / 2, L - jp, S - jp); g.clip();
        if (src) {
          const sw = src.naturalWidth, sh = src.naturalHeight;
          g.translate(x + L / 2, y + S / 2);
          if (p.plank) { // wood grain runs along the plank: the photo has vertical grain, rotate it 90 degrees
            const cw = sw * (0.16 + q() * 0.06), ch = Math.min(sh, cw * L / S), cx = q() * (sw - cw), cy = q() * (sh - ch);
            g.rotate(Math.PI / 2 * (q() < 0.5 ? 1 : -1)); g.drawImage(src, cx, cy, cw, ch, -S / 2, -L / 2, S, L);
          } else {
            const k2 = 0.62 + q() * 0.3, cw = Math.min(sw, sh * L / S) * k2, ch = cw * S / L, cx = q() * (sw - cw), cy = q() * (sh - ch);
            if (q() < 0.5) g.rotate(Math.PI);
            const rp = p.texRepeat || 1;
            if (rp === 1) g.drawImage(src, cx, cy, cw, ch, -L / 2, -S / 2, L, S);
            else for (let i = 0; i < rp; i++) for (let j = 0; j < rp; j++) { // fine-grained stones: several small crops per piece
              const c2w = cw / 1.15, c2h = ch / 1.15, ox = q() * (sw - c2w), oy = q() * (sh - c2h);
              g.drawImage(src, ox, oy, c2w, c2h, -L / 2 + i * L / rp, -S / 2 + j * S / rp, L / rp + 0.6, S / rp + 0.6);
            }
          }
        } else proceduralTile(g, p, x, y, L, S, q);
        g.restore();
        if (p.gloss > 0.4) { const gr = g.createLinearGradient(x, y, x + L, y + S); gr.addColorStop(0, 'rgba(255,255,255,.06)'); gr.addColorStop(1, 'rgba(0,0,0,.04)'); g.fillStyle = gr; g.fillRect(x + jp / 2, y + jp / 2, L - jp, S - jp); }

  }
  function proceduralTile(g, p, x, y, L, S, rnd) {
    const base = new T.Color(p.hex), hsl = {}; base.getHSL(hsl);

    const l = hsl.l + (rnd() - 0.5) * (zel ? 0.16 : 0.03), s = hsl.s + (rnd() - 0.5) * (zel ? 0.1 : 0);
    const c = new T.Color().setHSL(hsl.h + (rnd() - 0.5) * 0.02, Math.max(0, s), Math.max(0, Math.min(1, l)));
    g.fillStyle = '#' + c.getHexString(); g.fillRect(x, y, L, S);

    gr.addColorStop(0, `rgba(255,255,255,${zel ? 0.28 : 0.18})`); gr.addColorStop(0.6, 'rgba(255,255,255,0)'); gr.addColorStop(1, `rgba(0,0,0,${zel ? 0.22 : 0.08})`);
    g.fillStyle = gr; g.fillRect(x, y, L, S);
    if (zel) { const gl = g.createLinearGradient(x, y, x, y + S); gl.addColorStop(0, 'rgba(255,255,255,.10)'); gl.addColorStop(0.5, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(0,0,0,.10)'); g.fillStyle = gl; g.fillRect(x, y, L, S); for (let i = 0; i < 2; i++) { g.fillStyle = `rgba(255,255,255,${0.05 + rnd() * 0.05})`; g.beginPath(); g.ellipse(x + rnd() * L, y + S * (0.3 + rnd() * 0.4), 10 + rnd() * 20, 2 + rnd() * 3, 0, 0, 7); g.fill(); } }
    else { g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 2; g.strokeRect(x + 2, y + 2, L - 4, S - 4); }

  async function surfaceTexture(p, grout, joint) {

  /** Small "room corner" render of a surface for cards and the product page. */

    const plain = new T.MeshStandardMaterial({ color: col('#efeeeb'), roughness: 0.9 });
    const floor = new T.Mesh(new T.PlaneGeometry(8, 3), wall ? new T.MeshStandardMaterial({ color: col('#bdb6ab'), roughness: 0.8 }) : surfMat); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; grp.add(floor);
    const back = new T.Mesh(new T.PlaneGeometry(8, 3), wall ? surfMat : plain); back.position.set(0, 1.5, -1.5); grp.add(back);
    if (wall) { const tw = tex.clone(); tw.needsUpdate = true; tw.repeat.set(8 / sizeM, 3 / sizeM); back.material = new T.MeshStandardMaterial({ map: tw, roughness: 1 - p.gloss * 0.9, envMapIntensity: 0.5 + p.gloss }); }
    S.ground.visible = false; S.scene.add(grp);
    S.cam.fov = 40; S.cam.aspect = w / h; S.cam.position.set(0.9, wall ? 1.1 : 1.55, wall ? 1.3 : 1.2); S.cam.lookAt(0, wall ? 0.75 : 0.05, wall ? -1.2 : -0.6); S.cam.updateProjectionMatrix();

  }

    panel(4, 2.5, -4.9, 3.5, 0, Math.PI / 2, 0xfff3e2);
    panel(3, 2, 4.9, 3, 1, -Math.PI / 2, 0xd8e2ec);

  function makeRenderer(canvas, opts = {}) {

    r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));

  /* ---------- studio thumbnails ---------- */
  let studio = null;
  function getStudio() {

    const canvas = document.createElement('canvas');
    const r = makeRenderer(canvas, { preserve: true });
    r.setPixelRatio(1);
    const scene = new T.Scene(); scene.environment = makeEnv(r);
    scene.add(new T.HemisphereLight(0xfff6ea, 0x8b7a68, 0.55));
    const key = new T.DirectionalLight(0xfff1e0, 1.25); key.position.set(-2.5, 4, 3); key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 3; key.shadow.camera.bottom = -3; key.shadow.radius = 6; key.shadow.bias = -0.0005;
    scene.add(key);

    const cam = new T.PerspectiveCamera(30, 1, 0.05, 50);

function bindBA(ba) {
  if (!ba) return; const knob = $('.knob', ba), line = $('.line', ba), after = $('.after', ba);
  let cur = 50;
  const set = pct => {
    cur = Math.max(2, Math.min(98, pct)); const x = ba.clientWidth * cur / 100;
    after.style.clipPath = `inset(0 0 0 ${cur}%)`; line.style.transform = knob.style.transform = `translateX(${x}px)`;
    knob.setAttribute('aria-valuenow', Math.round(cur));
  };
  set(50); new ResizeObserver(() => set(cur)).observe(ba);
  let drag = false;
  const at = e => { const r = ba.getBoundingClientRect(); set((e.clientX - r.left) / r.width * 100); };
  ba.addEventListener('pointerdown', e => { drag = true; ba.setPointerCapture(e.pointerId); at(e); });
  ba.addEventListener('pointermove', e => drag && at(e));
  ['pointerup', 'pointercancel'].forEach(t => ba.addEventListener(t, () => drag = false));
  knob.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') set(cur - 5); if (e.key === 'ArrowRight') set(cur + 5); });
  // one explanatory sweep, only on the first visit of the session
  let seen = false; try { seen = sessionStorage.getItem('cauce.ba') === '1'; sessionStorage.setItem('cauce.ba', '1'); } catch (e) { }
  if (!REDUCED && !seen) {
    const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, keys = [50, 30, 70, 50], dur = 800;
    let seg = 0, t0 = 0;
    const step = now => { if (drag) return; if (!t0) t0 = now; const k = Math.min(1, (now - t0) / dur); set(keys[seg] + (keys[seg + 1] - keys[seg]) * ease(k)); if (k < 1) return requestAnimationFrame(step); if (++seg < keys.length - 1) { t0 = now; requestAnimationFrame(step); } };
    setTimeout(() => requestAnimationFrame(step), 900);
  }
}

function afterPdp(p) {

    $('#lwIn').oninput = e => { const n = String(e.target.value).replace(/,/g, '.').match(/[\d.]+/g); if (n && n.length >= 2) { pdpState.m2 = Math.round(+n[0] * +n[1] * 100) / 100; $('#m2In').value = pdpState.m2; calc(); } };
    calc();

/* ---------- product 3D viewer (one renderer, reused) ---------- */
const Viewer = {
  r: null, scene: null, cam: null, obj: null, yaw: -0.6, pitch: 0.28, raf: 0, idle: true, box: null,
  init() {
    if (this.r) return; const T = E3.T;
    this.canvas = document.createElement('canvas'); this.canvas.setAttribute('role', 'img');
    this.r = E3.makeRenderer(this.canvas); this.scene = new T.Scene(); this.scene.environment = E3.makeEnv(this.r);
    this.scene.add(new T.HemisphereLight(0xffffff, 0x8b8b88, 0.55));
    const k = new T.DirectionalLight(0xffffff, 1.2); k.position.set(-2.5, 4, 3); k.castShadow = true; k.shadow.mapSize.set(1024, 1024);
    Object.assign(k.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); k.shadow.radius = 6; this.scene.add(k);
    const g = new T.Mesh(new T.PlaneGeometry(20, 20), new T.ShadowMaterial({ opacity: 0.14 })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; this.scene.add(g);
    this.cam = new T.PerspectiveCamera(30, 1, 0.02, 50);
    let drag = null;
    this.canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: this.yaw, pitch: this.pitch }; this.canvas.setPointerCapture(e.pointerId); this.idle = false; });
    this.canvas.addEventListener('pointermove', e => { if (!drag) return; this.yaw = drag.yaw - (e.clientX - drag.x) * 0.01; this.pitch = Math.max(0.02, Math.min(1.1, drag.pitch + (e.clientY - drag.y) * 0.006)); });
    this.canvas.addEventListener('pointerup', () => drag = null);
    this.canvas.tabIndex = 0;
    this.canvas.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') this.yaw += 0.2; if (e.key === 'ArrowRight') this.yaw -= 0.2; this.idle = false; });
  },
  mount(box, p, v) {
    this.init(); box.prepend(this.canvas); this.box = box; this.yaw = -0.6; this.pitch = 0.28; this.idle = true;
    this.canvas.setAttribute('aria-label', `Modelo 3D de ${p.name}`);
    this.setProduct(p, v); this.loop();
  },
  setProduct(p, v) {
    if (this.obj) { this.scene.remove(this.obj); E3.disposeTree(this.obj); }
    this.obj = E3.build(p, v); this.obj.traverse(o => { if (o.isMesh) o.castShadow = true; }); this.scene.add(this.obj); this.p = p;
    const T = E3.T, b = new T.Box3().setFromObject(this.obj); this.ctr = b.getCenter(new T.Vector3()); this.rad = b.getSize(new T.Vector3()).length() / 2 * 1.15;
  },
  loop() {
    cancelAnimationFrame(this.raf);
    const tick = () => {
      if (!this.box || !this.box.isConnected) { this.box = null; return; }
      const w = this.box.clientWidth, h = this.box.clientHeight;
      if (this.canvas.width !== Math.round(w * this.r.getPixelRatio())) this.r.setSize(w, h, false);
      if (this.idle && !REDUCED) this.yaw += 0.004;
      const c = this.cam, fov = c.fov * Math.PI / 180, aspect = w / h, dist = this.rad / Math.sin(Math.min(fov, fov * aspect) / 2);
      c.aspect = aspect; c.position.set(this.ctr.x + Math.sin(this.yaw) * Math.cos(this.pitch) * dist, this.ctr.y + Math.sin(this.pitch) * dist, this.ctr.z + Math.cos(this.yaw) * Math.cos(this.pitch) * dist);
      c.lookAt(this.ctr); c.updateProjectionMatrix();
      this.r.render(this.scene, c); this.raf = requestAnimationFrame(tick);
    };
    tick();
  },
};

  $$('.navlinks a').forEach(a => a.classList.toggle('on', h === 'c-' + a.dataset.cat));

  function initThree() {

  function loadPhoto(src, source, then) {

      const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));

  /* ---------- zones: the floor and each wall keep their own finish (porcelanato, revestimiento a media altura + pintura, o pintura) ---------- */
  function blur1(src, w, h, r) {

        for (let p = 0; p < len; p++) { d[idx(p)] = acc * k; acc += s[idx(Math.min(len - 1, p + r + 1))] - s[idx(Math.max(0, p - r))]; }

    $('#floattb').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || !S.sel) return; const it = S.sel;
      if (b.dataset.act === 'rotl') it.yaw += Math.PI / 8; if (b.dataset.act === 'rotr') it.yaw -= Math.PI / 8;
      if (b.dataset.act === 'dup') return addItem(it.p.id, it.v, clamp(it.u + 0.08, 0, 1), it.vv);
      if (b.dataset.act === 'del') return removeItem(it);
      updateItem(it); renderSel(); renderProject();
    });
    const ob = $('#origBtn'), on = v => { S.showOrig = v; $('#glC').style.visibility = v ? 'hidden' : ''; compose(); drawZones(); positionToolbar(); ob.setAttribute('aria-pressed', v); };
    ob.addEventListener('pointerdown', () => on(true)); ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => ob.addEventListener(t, () => S.showOrig && on(false)));
    ob.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); on(!S.showOrig); } });
    $('#saveBtn').onclick = saveImage;
    $('#camH').oninput = e => { S.params.camH = e.target.value / 100; $('#camHV').textContent = e.target.value + ' cm'; applyParams(); S.items.forEach(updateItem); recalcZones(); };
    $('#fovR').oninput = e => { const hv = horizonV(); S.params.fov = +e.target.value; $('#fovV').textContent = e.target.value + '°'; setHorizonV(hv); };
    const hb = $('#hzBtn'); let hd = false;
    hb.addEventListener('pointerdown', e => { hd = true; hb.setPointerCapture(e.pointerId); e.stopPropagation(); });
    hb.addEventListener('pointermove', e => { if (!hd) return; const r = stageEl.getBoundingClientRect(); setHorizonV((e.clientY - r.top) / r.height); });
    hb.addEventListener('pointerup', () => { hd = false; renderProject(); });
    hb.addEventListener('keydown', e => { if (e.key === 'ArrowUp') setHorizonV(horizonV() - 0.01); if (e.key === 'ArrowDown') setHorizonV(horizonV() + 0.01); });
    $('#wallW').oninput = e => { const v = +e.target.value; if (v >= 50) { S.wallW = v; renderProject(); } };
    $('#projCart').onclick = () => {
      const r = surfRows();
      r.tiles.forEach(t => Cart.add(t.p.id, 0, t.cajas, true)); r.paints.forEach(t => Cart.add(t.p.id, t.v, t.latas, true)); S.items.forEach(it => Cart.add(it.p.id, it.v, 1, true));
      confirmBtn($('#projCart'), 'Proyecto agregado'); toast('Proyecto agregado al carrito'); setTimeout(openCart, 450);
    };
    $('#askForm').onsubmit = e => { e.preventDefault(); const q = $('#askIn').value.trim(); if (q) ask(q); };
  }
  function readFile(f) {
    if (f.size > 25e6) { status('La foto pesa más de 25 MB. Probá con una más liviana.', false); return; }
    const url = URL.createObjectURL(f); aiState = 'idle'; loadPhoto(url, 'subida'); const sel = $('#simSampleSel'); if (sel) sel.selectedIndex = -1;
  }
  function renderPlist(cat) {
    const L = PRODUCTS.filter(p => cat === 'todos' || p.cat === cat);
    $('#plist').innerHTML = L.map(p => `<button class="pi" data-addp="${p.id}" aria-label="${p.type === 'superficie' ? 'Revestir con' : p.type === 'pintura' ? 'Pintar con' : 'Agregar'} ${esc(p.name)}"><span class="shimmer">${timg(p.id, p.type === 'pintura' ? 6 : 0, '')}</span><span style="min-width:0"><span class="n">${esc(p.name)}</span><span class="p">${p.type === 'superficie' ? `${fmt(p.price)} el m² · <span class="mono">${fmtCm(p.fmt[0])}×${fmtCm(p.fmt[1])}</span>` : p.type === 'pintura' ? `${fmt(p.price)} la lata · 12 colores` : `${fmt(p.price)} · <span class="mono">${p.dims.w} cm</span>`}</span></span><span class="add">${ico(p.type === 'superficie' ? 'grid' : p.type === 'pintura' ? 'brush' : 'plus')}</span></button>`).join('');
    fillThumbs($('#plist'));
    $$('[data-addp]').forEach(b => b.onclick = () => addItem(b.dataset.addp, PBYID[b.dataset.addp].type === 'pintura' ? 6 : 0));
  }

  /* ---------- export ---------- */
  function exportComposite() {
    const w = work.width, h = work.height, out = document.createElement('canvas'); out.width = w; out.height = h;
    const g = out.getContext('2d'); g.drawImage(painted, 0, 0);
    const ring0 = ring.visible, grid0 = grid.visible; ring.visible = false; grid.visible = false;
    const pr = renderer.getPixelRatio(), sw = stageEl.clientWidth, sh = stageEl.clientHeight;
    renderer.setPixelRatio(1); renderer.setSize(w, h, false); renderer.render(scene, camera); g.drawImage($('#glC'), 0, 0, w, h);
    renderer.setPixelRatio(pr); renderer.setSize(sw, sh, false); ring.visible = ring0; grid.visible = grid0; needRender = true;
    return out;
  }
  async function saveImage() {
    const out = exportComposite(), g = out.getContext('2d'), w = out.width, h = out.height;
    g.font = `600 ${Math.round(h * 0.02)}px Poppins, sans-serif`; g.fillStyle = 'rgba(255,255,255,.88)'; g.textAlign = 'right'; g.fillText('PROBADO EN CAUCE', w - h * 0.025, h - h * 0.03);
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    if (downloadsApi) {
      try { await downloadsApi.save({ filename: 'cauce-mi-bano.png', data: blob }); toast('Imagen guardada'); return; }
      catch (e) { if (e?.code === 'declined') return; }
    }
    const url = URL.createObjectURL(blob);
    document.body.insertAdjacentHTML('beforeend', `<div class="modal" role="dialog" aria-label="Imagen del proyecto"><div class="bg" data-x></div><div class="box"><div class="aihead"><b>Tu ambiente con Cauce</b><button class="iconbtn" data-x aria-label="Cerrar">${ico('x')}</button></div><img src="${url}" alt="Tu ambiente con los revestimientos y productos"><p class="note" style="margin:0">Mantené apretada la imagen (o clic derecho) para guardarla y compartirla.</p></div></div>`);
    $$('.modal [data-x]').forEach(b => b.onclick = closeModal);
  }

  function flushPending() {
    if (!S.params || !work.width) return;
    while (S.pending.length) { const { id, v } = S.pending.shift(); addItem(id, v); }
  }
  return {
    pending: S.pending, SAMPLES,
    debug: () => S, applyZone: (ref, pid, extra) => applyZone(ref, pid, extra), zones: () => S.zones,
    addItem: (...a) => addItem(...a), select: it => select(it), selectZone: id => { S.zsel = id; renderZonePanel(); }, update: it => { updateItem(it); applyParams(); renderProject(); },
    loadSample: (id, cb) => { S.sampleId = id; $('#simSampleSel').value = id; loadPhoto(SAMPLES[id].url, 'ejemplo', cb); },
    setMode: m => setMode(m), exportPNG: () => exportComposite(), worldAt: (u, v, y) => worldAt(u, v, y, true), horizonV: () => horizonV(), idle: () => rq,
    show() { build(); requestAnimationFrame(() => { sizeStage(); flushPending(); needRender = true; }); },
    hide() { },
    flushPending,
    refresh() { if (!S.built) return; const t = $('[data-ptab].on'); renderPlist(t ? t.dataset.ptab : 'todos'); },
  };
})();


boot();
</script>
