<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Encaja: muebles y deco que se prueban en tu casa con IA antes de comprar."><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Encaja Deco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: editorial retail — hueso cálido + tinta, serif de display, pastillas oscuras; hero antes/después (ref. "Obra Fina") */
:root{
  --bg:#F2EDE7; --surface:#FBF8F4; --sunken:#E8E1D8; --ink:#1E1A17; --muted:#6E665E; --line:#DCD4CA;
  --btn:#1E1A17; --on-btn:#FBF8F4; --oak:#9A6B40; --ok:#2E6A4E; --ok-bg:#E1EDE5; --warn:#A8492A; --warn-bg:#F6E3DA;
  --band:#1E1A17; --on-band:#F2EDE7; --band-muted:#B5AA9E;
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-card:22px; --r-tile:16px; --shadow:0 1px 2px rgba(30,26,23,.05),0 10px 30px rgba(30,26,23,.07);
  --wrap:1240px;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161412; --surface:#1F1C19; --sunken:#2A2622; --ink:#F2EDE7; --muted:#A99F94; --line:#3A342E;
  --btn:#F2EDE7; --on-btn:#1E1A17; --oak:#D4A576; --ok:#7CC39D; --ok-bg:#1E3329; --warn:#E9926C; --warn-bg:#3A2219;
  --band:#0E0C0B; --on-band:#F2EDE7; --band-muted:#A99F94; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161412; --surface:#1F1C19; --sunken:#2A2622; --ink:#F2EDE7; --muted:#A99F94; --line:#3A342E;
  --btn:#F2EDE7; --on-btn:#1E1A17; --oak:#D4A576; --ok:#7CC39D; --ok-bg:#1E3329; --warn:#E9926C; --warn-bg:#3A2219;
  --band:#0E0C0B; --on-band:#F2EDE7; --band-muted:#A99F94; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oak);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:-.01em;line-height:1.02;text-wrap:balance;margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:14px;text-decoration:none;transition:background-color 200ms ease,color 200ms ease,border-color 200ms ease,transform 160ms var(--ease-out);white-space:nowrap}
.btn:active{transform:scale(.97)}
.iconbtn,.chip,.pi,.floattb button,.swpick button,.palette button,.qty button,.seg button{transition:background-color 200ms ease,color 200ms ease,transform 160ms var(--ease-out)}
.iconbtn:active,.chip:active,.pi:active,.floattb button:active,.swpick button:active,.palette button:active,.qty button:active,.seg button:active{transform:scale(.95)}
.btn-dark{background:var(--btn);color:var(--on-btn)}
.btn-dark:hover{background:color-mix(in srgb,var(--btn) 86%,var(--oak))}
.btn-line{background:var(--surface);border-color:var(--line)}
.btn-line:hover{border-color:var(--ink)}
.btn-ghost{background:transparent;border-color:transparent;padding:0 12px}
.btn-ghost:hover{background:var(--sunken)}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:999px;border:1px solid transparent;background:transparent;position:relative}
.iconbtn:hover{background:var(--sunken)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none}
.chip[aria-pressed="true"],.chip.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}

/* promo + header */
.promo{background:var(--band);color:var(--on-band);font-size:12.5px}
.promo .wrap{display:flex;gap:28px;justify-content:center;padding-block:8px;overflow:hidden;white-space:nowrap}
.promo b{color:var(--oak);font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .promo b{color:#D4A576}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;min-height:64px}
.logo{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-size:28px;text-decoration:none;letter-spacing:-.01em}
.logo svg{width:26px;height:14px;align-self:center;color:var(--oak)}
.navlinks{display:flex;gap:4px;margin-left:12px}
.navlinks{align-items:center;flex-wrap:nowrap}
.navlinks a{padding:8px 12px;border-radius:999px;font-size:14px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;line-height:1.2}
.navlinks a:hover,.navlinks a.on{color:var(--ink);background:var(--sunken)}
.nav .sp{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);min-width:0;width:220px}
.searchbox input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:14px}
.badge-n{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--oak);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.catrow{display:none}
@media (max-width:1240px){.navlinks{display:none}.catrow{display:flex;gap:8px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}.catrow::-webkit-scrollbar{display:none}}
@media (max-width:720px){.searchbox{display:none}.nav .cta-desk{display:none}.logo{font-size:25px}.promo .wrap{justify-content:flex-start}.promo .p2,.promo .p3{display:none}}

main{min-height:60vh}
section{padding-block:28px}

/* hero (antes / después) */
.hero{padding-block:24px 8px}
.herocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);gap:36px;padding:36px}
.herocopy{display:flex;flex-direction:column;gap:18px;min-width:0;justify-content:center}
.herocopy h1{font-size:clamp(44px,6vw,76px)}
.herocopy h1 em{font-style:italic;color:var(--oak)}
.herocopy p{margin:0;color:var(--muted);max-width:44ch;font-size:16px}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:20px 32px;border-top:1px solid var(--line);padding-top:18px;margin-top:10px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--f-display);font-size:30px;font-weight:400;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.ba{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/2;background:var(--sunken);user-select:none;touch-action:pan-y;max-width:100%}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ba .after{clip-path:inset(0 0 0 50%)}
.ba .line{position:absolute;top:0;bottom:0;left:0;will-change:transform;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.ba .knob{position:absolute;top:50%;left:0;will-change:transform;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;color:#1E1A17;display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.18);border:0;cursor:ew-resize}
.ba .tag{position:absolute;bottom:12px;padding:4px 10px;border-radius:999px;background:rgba(20,16,12,.55);color:#fff;font-size:11px;letter-spacing:.12em;font-weight:600;backdrop-filter:blur(6px)}
.bacap{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bacap b{color:var(--ink);font-weight:600}
.cota{position:absolute;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:#fff;background:rgba(20,16,12,.6);padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px);pointer-events:none}
.cota::before,.cota::after{content:"";width:14px;height:1px;background:currentColor}
.shimmer{background:linear-gradient(100deg,var(--sunken) 30%,color-mix(in srgb,var(--sunken) 60%,var(--surface)) 50%,var(--sunken) 70%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:900px){.herocard{grid-template-columns:1fr;padding:22px;gap:22px}.herovis{order:-1}}

/* section heads */
.shead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.shead h2{font-size:clamp(32px,4vw,44px)}
.shead a{font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.cat{background:var(--sunken);border-radius:var(--r-tile);padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:transform 200ms var(--ease-out);min-width:0}
@media (hover:hover) and (pointer:fine){.cat:hover{transform:translateY(-2px)}}
.cat:active{transform:scale(.98)}
.cat .img{aspect-ratio:1;display:block;position:relative;overflow:hidden}
.cat img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain}
.cat b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.cat span{font-size:12px;color:var(--muted)}
@media (max-width:900px){.cats{grid-template-columns:repeat(6,minmax(0,1fr))}.cat{grid-column:span 2}.cat:nth-child(n+4){grid-column:span 3}.cat:nth-child(n+4) .img{aspect-ratio:2/1}}
@media (max-width:560px){.cat,.cat:nth-child(n+4){grid-column:span 3}.cat:nth-child(n+4) .img{aspect-ratio:1}.cat:last-child{grid-column:1/-1}.cat:last-child .img{aspect-ratio:2.2/1}}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:1020px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;text-decoration:none;position:relative}
.card .imgwrap{position:relative}
.card .img{position:relative;aspect-ratio:1;border-radius:var(--r-tile);background:var(--sunken);overflow:hidden;display:grid;place-items:center}
.card .img img{width:88%;height:88%;object-fit:contain;transition:transform 250ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){.card:hover .img img{transform:scale(1.03)}}
.pill{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pill.sale{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tryon{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--btn);color:var(--on-btn);opacity:0;transform:translateY(4px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);border:0;min-height:32px}
.card:hover .tryon,.card:focus-within .tryon{opacity:1;transform:none}
@media (hover:none){.tryon{opacity:1;transform:none}}
.card .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.card .name{font-weight:600;font-size:14.5px;line-height:1.3}
.card .dims{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-size:13px}
.cuotas{font-size:12px;color:var(--ok);font-weight:600}
.sw{display:flex;gap:5px}
.sw i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}

/* banners */
.band{background:var(--band);color:var(--on-band);border-radius:var(--r-card);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;position:relative}
.band .copy{padding:44px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.band h2{font-size:clamp(36px,4.6vw,58px)}
.band p{margin:0;color:var(--band-muted);max-width:42ch}
.band .eyebrow{color:var(--band-muted)}
.band .btn-light{background:var(--on-band);color:#1E1A17}
.band .vis{position:relative;height:100%;min-height:320px;display:flex;align-items:end;justify-content:center;gap:0}
.band .vis::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 60% 40%,rgba(255,196,120,.33),transparent 70%)}
.band .vis img{position:relative;height:300px;width:auto;max-width:55%;object-fit:contain}
@media (max-width:800px){.band{grid-template-columns:1fr}.band .copy{padding:28px}.band .vis{min-height:240px}.band .vis img{height:220px}}
.inspo{position:relative;display:block;border-radius:var(--r-card);overflow:hidden;min-height:420px;text-decoration:none;color:#fff;background:#2a2622}
.inspo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 600ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){.inspo:hover img{transform:scale(1.02)}}
.inspo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,16,12,.72) 0%,rgba(20,16,12,.35) 45%,rgba(20,16,12,0) 70%)}
.inspo-copy{position:relative;z-index:1;max-width:460px;padding:44px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.inspo-copy h2{font-size:clamp(36px,4.4vw,56px)}
.inspo-copy p{margin:0;color:rgba(255,255,255,.85)}
.inspo-copy .eyebrow{color:rgba(255,255,255,.75)}
.inspo .btn-light{background:#F2EDE7;color:#1E1A17}
@media (max-width:700px){.inspo{min-height:460px;display:flex;align-items:flex-end}.inspo::after{background:linear-gradient(0deg,rgba(20,16,12,.8) 10%,rgba(20,16,12,.1) 70%)}.inspo-copy{padding:24px}}
.band .vis.photo{align-items:stretch;justify-content:stretch;min-height:380px}
.band .vis.photo::before{display:none}
.band .vis.photo img{height:100%;width:100%;max-width:none;object-fit:cover;position:absolute;inset:0}
.chip-k{position:absolute;left:16px;bottom:16px;display:inline-flex;gap:6px;align-items:center;background:rgba(20,16,12,.6);color:#fff;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.paintvis{position:relative;min-height:340px}
.paintvis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 78%}
.swrow{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:6px;flex-wrap:wrap;background:rgba(251,248,244,.9);padding:8px;border-radius:999px;justify-content:center}
.swrow span{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.paintband{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow:hidden}
.paintband .copy{padding:40px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.paintband h2{font-size:clamp(34px,4.2vw,52px)}
.paintband p{margin:0;color:var(--muted);max-width:44ch}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;min-height:300px}
.swatches div{display:flex;align-items:end;padding:12px;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.swatches div.lt{color:#1E1A17;text-shadow:none}
@media (max-width:800px){.paintband{grid-template-columns:1fr}.paintband .copy{padding:26px}.swatches{min-height:180px}}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:s}
.step{border-top:1px solid var(--ink);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.step .n{font-family:var(--f-mono);font-size:12px;color:var(--oak)}
.step h3{font-size:28px}
.step p{margin:0;color:var(--muted);font-size:14px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;border-block:1px solid var(--line);padding-block:22px}
.trust div{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--muted)}
.trust b{display:block;color:var(--ink);font-size:14px}
.trust .ico{width:22px;height:22px;color:var(--oak);margin-top:2px}
@media (max-width:820px){.trust{grid-template-columns:repeat(2,minmax(0,1fr))}}
footer{padding-block:40px 60px;color:var(--muted);font-size:13px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}
footer h4{margin:0 0 10px;color:var(--ink);font-size:13px}
footer a{display:block;text-decoration:none;padding:3px 0}
footer a:hover{color:var(--ink)}
@media (max-width:760px){footer .cols{grid-template-columns:1fr 1fr}}

/* catalog page */
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;padding-top:18px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding-block:12px 18px}
.pagehead h1{font-size:clamp(40px,5vw,64px)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13px;font-weight:600}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;padding-block:12px 20px}
@media (max-width:900px){.pdp{grid-template-columns:1fr;gap:22px}}
.viewer{position:relative;aspect-ratio:1/0.9;background:var(--sunken);border-radius:var(--r-card);overflow:hidden;touch-action:none;cursor:grab;max-width:100%}
.viewer:active{cursor:grabbing}
.viewer canvas{width:100%!important;height:100%!important;display:block}
.viewer .hint{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;background:var(--surface);padding:6px 10px;border-radius:999px}
.viewer .dimtag{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.viewer .dimtag span{font-family:var(--f-mono);font-size:12px;background:var(--surface);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
.buy{display:flex;flex-direction:column;gap:16px;min-width:0}
.buy h1{font-size:clamp(38px,4.4vw,56px)}
.rating{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

let heroEntered = false;
function afterHome() { bindBA($('#ba')); heroEntered = true; }
function bindBA(ba) {
  if (!ba) return; const knob = $('.knob', ba), line = $('.line', ba), after = $('.after', ba);
  let cur = 50;
  // clip-path on the "after" photo + transforms on the handle: all GPU, no CSS variable on the parent
  const set = pct => {
    cur = Math.max(2, Math.min(98, pct)); const x = ba.clientWidth * cur / 100;
    after.style.clipPath = `inset(0 0 0 ${cur}%)`; line.style.transform = knob.style.transform = `translateX(${x}px)`;
    knob.setAttribute('aria-valuenow', Math.round(cur));
  };
  set(50); new ResizeObserver(() => set(cur)).observe(ba);
  let drag = false;
  const at = e => { const r = ba.getBoundingClientRect(); set((e.clientX - r.left) / r.width * 100); };
  ba.addEventListener('pointerdown', e => { drag = true; ba.setPointerCapture(e.pointerId); at(e); });
  ba.addEventListener('pointermove', e => drag && at(e));
  ['pointerup', 'pointercancel'].forEach(t => ba.addEventListener(t, () => drag = false));
  knob.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') set(cur - 5); if (e.key === 'ArrowRight') set(cur + 5); });
  // one explanatory sweep, only on the first visit of the session (shows the photo can be compared)
  let seen = false; try { seen = sessionStorage.getItem('encaja.ba') === '1'; sessionStorage.setItem('encaja.ba', '1'); } catch (e) { }
  if (!REDUCED && !seen) {
    const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, keys = [50, 30, 70, 50], dur = 700;
    let seg = 0, t0 = 0;
    const step = now => { if (drag) return; if (!t0) t0 = now; const k = Math.min(1, (now - t0) / dur); set(keys[seg] + (keys[seg + 1] - keys[seg]) * ease(k)); if (k < 1) return requestAnimationFrame(step); if (++seg < keys.length - 1) { t0 = now; requestAnimationFrame(step); } };
    setTimeout(() => requestAnimationFrame(step), 700);
  }
}

/* ---------- product 3D viewer (one renderer, reused) ---------- */
const Viewer = {
  r: null, scene: null, cam: null, obj: null, yaw: -0.6, pitch: 0.28, raf: 0, on: false, idle: true, box: null,
  init() {
    if (this.r) return; const T = E3.T;
    this.canvas = document.createElement('canvas'); this.canvas.setAttribute('role', 'img');
    this.r = E3.makeRenderer(this.canvas); this.scene = new T.Scene(); this.scene.environment = E3.makeEnv(this.r);
    this.scene.add(new T.HemisphereLight(0xfff6ea, 0x8b7a68, 0.5));
    const k = new T.DirectionalLight(0xfff1e0, 1.2); k.position.set(-2.5, 4, 3); k.castShadow = true; k.shadow.mapSize.set(1024, 1024);
    Object.assign(k.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); k.shadow.radius = 6; this.key = k; this.scene.add(k);
    const g = new T.Mesh(new T.PlaneGeometry(20, 20), new T.ShadowMaterial({ opacity: 0.16 })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; this.scene.add(g);
    this.cam = new T.PerspectiveCamera(30, 1, 0.05, 50);
    let drag = null;
    this.canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: this.yaw, pitch: this.pitch }; this.canvas.setPointerCapture(e.pointerId); this.idle = false; });
    this.canvas.addEventListener('pointermove', e => { if (!drag) return; this.yaw = drag.yaw - (e.clientX - drag.x) * 0.01; this.pitch = Math.max(0.02, Math.min(1.1, drag.pitch + (e.clientY - drag.y) * 0.006)); });
    this.canvas.addEventListener('pointerup', () => drag = null);
    this.canvas.tabIndex = 0;
    this.canvas.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') this.yaw += 0.2; if (e.key === 'ArrowRight') this.yaw -= 0.2; this.idle = false; });
  },
  mount(box, p, v) {
    this.init(); box.prepend(this.canvas); this.box = box; this.on = false; this.yaw = -0.6; this.pitch = 0.28; this.idle = true;
    this.canvas.setAttribute('aria-label', `Modelo 3D de ${p.name}`);
    this.setProduct(p, v); this.loop();
  },
  setProduct(p, v) {
    if (this.obj) { this.scene.remove(this.obj); E3.disposeTree(this.obj); }
    this.obj = E3.build(p, v); this.scene.add(this.obj); this.p = p;
    if (this.on && this.obj.userData.setOn) this.obj.userData.setOn(true, p.kelvin, 1.3);
    const T = E3.T, b = new T.Box3().setFromObject(this.obj); this.ctr = b.getCenter(new T.Vector3()); this.rad = b.getSize(new T.Vector3()).length() / 2 * 1.15;
  },
  toggleLamp() { this.on = !this.on; this.obj.userData.setOn?.(this.on, this.p.kelvin, 1.3); this.key.intensity = this.on ? 0.35 : 1.2; return this.on; },
  loop() {
    cancelAnimationFrame(this.raf);
    const tick = () => {
      if (!this.box || !this.box.isConnected) { this.box = null; return; }
      const w = this.box.clientWidth, h = this.box.clientHeight;
      if (this.canvas.width !== Math.round(w * this.r.getPixelRatio())) this.r.setSize(w, h, false);
      if (this.idle && !REDUCED) this.yaw += 0.004;
      const c = this.cam, fov = c.fov * Math.PI / 180, aspect = w / h, dist = this.rad / Math.sin(Math.min(fov, fov * aspect) / 2);
      c.aspect = aspect; c.position.set(this.ctr.x + Math.sin(this.yaw) * Math.cos(this.pitch) * dist, this.ctr.y + Math.sin(this.pitch) * dist, this.ctr.z + Math.cos(this.yaw) * Math.cos(this.pitch) * dist);
      c.lookAt(this.ctr); c.updateProjectionMatrix();
      this.r.render(this.scene, c); this.raf = requestAnimationFrame(tick);
    };
    tick();
  },
};

/* ---------- background removal (in the browser) ---------- */
// Flood-fills the backdrop from every border pixel (studio photos on white / plain walls),
// feathers the edge and crops to the product. Keeps existing transparency untouched.
function cutout(img, tol, removeBg) {
  const max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  const id = g.getImageData(0, 0, w, h), d = id.data;
  let hasAlpha = false; for (let x = 0; x < w; x++) if (d[x * 4 + 3] < 250 || d[((h - 1) * w + x) * 4 + 3] < 250) { hasAlpha = true; break; }
  if (removeBg && !hasAlpha) {
    const bg = new Uint8Array(w * h), q = new Int32Array(w * h); let qt = 0, qh = 0;
    const t2 = tol * tol * 3, step2 = Math.pow(tol * 0.6, 2) * 3;
    // reference: median-ish of the border colour
    let r = 0, gg = 0, b = 0, n = 0;
    const edge = []; for (let x = 0; x < w; x++) edge.push(x, (h - 1) * w + x); for (let y = 0; y < h; y++) edge.push(y * w, y * w + w - 1);
    edge.forEach(i => { r += d[i * 4]; gg += d[i * 4 + 1]; b += d[i * 4 + 2]; n++; }); r /= n; gg /= n; b /= n;
    const near = i => { const dr = d[i * 4] - r, dg = d[i * 4 + 1] - gg, db = d[i * 4 + 2] - b; return dr * dr + dg * dg + db * db <= t2; };
    const step = (i, j) => { const dr = d[i * 4] - d[j * 4], dg = d[i * 4 + 1] - d[j * 4 + 1], db = d[i * 4 + 2] - d[j * 4 + 2]; return dr * dr + dg * dg + db * db <= step2; };
    edge.forEach(i => { if (!bg[i] && near(i)) { bg[i] = 1; q[qt++] = i; } });
    while (qh < qt) {
      const i = q[qh++], x = i % w, y = (i / w) | 0;
      const nb = [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, y > 0 ? i - w : -1, y < h - 1 ? i + w : -1];
      for (const j of nb) if (j >= 0 && !bg[j] && near(j) && step(i, j)) { bg[j] = 1; q[qt++] = j; }
    }
    // soft floor shadows of the product photo: same colour as the backdrop but darker, reached through gentle
    // gradients. They become a translucent dark layer so they fall naturally on the room's floor.
    const bgL = 0.299 * r + 0.587 * gg + 0.114 * b + 1, cr0 = r - gg, cb0 = b - gg, sh = new Uint8Array(w * h);
    const shStep2 = Math.pow(Math.max(6, tol * 0.35), 2) * 3;
    const shadowish = j => { const L = 0.299 * d[j * 4] + 0.587 * d[j * 4 + 1] + 0.114 * d[j * 4 + 2], c1 = d[j * 4] - d[j * 4 + 1] - cr0, c2 = d[j * 4 + 2] - d[j * 4 + 1] - cb0;
      return L < bgL * 0.99 && L > bgL * 0.5 && c1 * c1 + c2 * c2 < 260; };
    qh = 0; qt = 0; for (let i = 0; i < w * h; i++) if (bg[i]) q[qt++] = i;
    while (qh < qt) {
      const i = q[qh++], x = i % w, y = (i / w) | 0;
      const nb = [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, y > 0 ? i - w : -1, y < h - 1 ? i + w : -1];
      for (const j of nb) { if (j < 0 || bg[j] || sh[j]) continue;
        const dr = d[i * 4] - d[j * 4], dg = d[i * 4 + 1] - d[j * 4 + 1], db = d[i * 4 + 2] - d[j * 4 + 2];
        if (dr * dr + dg * dg + db * db <= shStep2 && shadowish(j)) { sh[j] = 1; q[qt++] = j; } }
    }
    for (let i = 0; i < w * h; i++) if (sh[i]) {
      const L = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
      d[i * 4] = 20; d[i * 4 + 1] = 16; d[i * 4 + 2] = 12; d[i * 4 + 3] = Math.max(0, Math.min(200, (1 - L / bgL) * 2.2 * 255)); bg[i] = 2;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (bg[i] === 2) continue; if (bg[i]) { d[i * 4 + 3] = 0; continue; }
      let s = 0; if (x > 0 && bg[i - 1]) s++; if (x < w - 1 && bg[i + 1]) s++; if (y > 0 && bg[i - w]) s++; if (y < h - 1 && bg[i + w]) s++;
      if (s) d[i * 4 + 3] = Math.min(d[i * 4 + 3], 255 - s * 50);
    }
    g.putImageData(id, 0, 0);
  }
  // crop to visible pixels so the bottom edge touches the floor
  const a = g.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (a[(y * w + x) * 4 + 3] > 205) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);

}
function avgColor(cv) {

  for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 200) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; n++; }
  if (!n) return '#c9bfb2'; return '#' + [r, gg, b].map(v => Math.round(v / n).toString(16).padStart(2, '0')).join('');

        if (P.length >= 3 && Math.hypot((P[0][0] - u) * r.width, (P[0][1] - v) * r.height) < 18) { paintPoly(P); S.poly = []; drawPoly(); return; }

      }

    gl.addEventListener('pointermove', e => {
      const [u, v] = uvFromEvent(e);
      if (drag) { drag.it.u = clamp(u + drag.du, 0, 1); drag.it.vv = clamp(v + drag.dv, 0, 1); updateItem(drag.it); if (drag.it.p.type === 'luz' || S.items.some(i => i.on)) compose(); return; }
      if (S.mode === 'move' && e.pointerType === 'mouse') gl.style.cursor = pick(u, v) ? 'grab' : 'default';
    });
    const end = () => { if (drag) { drag = null; gl.style.cursor = 'grab'; applyParams(); renderProject(); } };
    gl.addEventListener('pointerup', end); gl.addEventListener('pointercancel', end);
    stageEl.addEventListener('keydown', e => {
      const it = S.sel; if (!it) return; let used = true;
      if (e.key === 'ArrowLeft') it.u -= 0.01; else if (e.key === 'ArrowRight') it.u += 0.01; else if (e.key === 'ArrowUp') it.vv -= 0.01; else if (e.key === 'ArrowDown') it.vv += 0.01;

    });
    $('#floattb').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || !S.sel) return; const it = S.sel;
      if (it.p.photo && (b.dataset.act === 'rotl' || b.dataset.act === 'rotr')) it.flip = !it.flip;
      else { if (b.dataset.act === 'rotl') it.yaw += Math.PI / 8; if (b.dataset.act === 'rotr') it.yaw -= Math.PI / 8; }

    $('#night').oninput = e => { S.night = e.target.value / 100; applyParams(); compose(); if (S.night > 0.4 && !S.items.some(i => i.p.type === 'luz')) status('Sumá una lámpara para ver cómo ilumina de noche', false); };
    const ob = $('#origBtn'), on = v => { S.showOrig = v; $('#glC').style.visibility = v ? 'hidden' : ''; compose(); positionToolbar(); ob.setAttribute('aria-pressed', v); };
    ob.addEventListener('pointerdown', () => on(true)); ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => ob.addEventListener(t, () => S.showOrig && on(false)));

    $('#saveBtn').onclick = saveImage;
    $('#tol').oninput = e => { S.tol = +e.target.value; $('#tolV').textContent = S.tol; };
    $('#undoPaint').onclick = () => { S.paints.pop(); rebuildPainted(); renderProject(); };
    $('#polyGo').onclick = () => { if (S.poly.length >= 3) { paintPoly(S.poly); S.poly = []; drawPoly(); } };

    $$('[data-pm]').forEach(b => b.onclick = () => { S.paintMode = b.dataset.pm; $$('[data-pm]').forEach(x => x.setAttribute('aria-pressed', x === b)); S.poly = []; drawPoly();
      $('#pmHelp').textContent = S.paintMode === 'auto' ? 'Tocá la pared: se pinta toda la zona del mismo color. Funciona mejor con paredes de color parejo; si se pasa, bajá la sensibilidad.' : 'Tocá las esquinas de la pared o de la puerta, una por una. Cerrá tocando el primer punto o con “Pintar zona”.'; });

    $('#camH').oninput = e => { S.params.camH = e.target.value / 100; $('#camHV').textContent = e.target.value + ' cm'; applyParams(); S.items.forEach(updateItem); compose(); };
    $('#fovR').oninput = e => { const hv = horizonV(); S.params.fov = +e.target.value; $('#fovV').textContent = e.target.value + '°'; setHorizonV(hv); };
    const hb = $('#hzBtn'); let hd = false;
    hb.addEventListener('pointerdown', e => { hd = true; hb.setPointerCapture(e.pointerId); e.stopPropagation(); });

    hb.addEventListener('pointerup', () => { hd = false; renderProject(); });
    hb.addEventListener('keydown', e => { if (e.key === 'ArrowUp') setHorizonV(horizonV() - 0.01); if (e.key === 'ArrowDown') setHorizonV(horizonV() + 0.01); });

    $('#projCart').onclick = () => {
      S.items.forEach(it => Cart.add(it.p.id, it.v, 1, true)); uniquePaints().forEach(pp => Cart.add(pp.p.id, pp.v, 1, true));

    const g = out.getContext('2d'); g.drawImage(view, 0, 0);

    const pr = renderer.getPixelRatio(), sw = stageEl.clientWidth, sh = stageEl.clientHeight;
    renderer.setPixelRatio(1); renderer.setSize(w, h, false); renderer.render(scene, camera); g.drawImage($('#glC'), 0, 0, w, h);
    renderer.setPixelRatio(pr); renderer.setSize(sw, sh, false); ring.visible = ring0; grid.visible = grid0; needRender = true;

    const g = out.getContext('2d'); g.drawImage(view, 0, 0);
